[project]
name = "fastapi-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi==0.125.0",
    "httpx>=0.28.1",
    "pydantic==2.12.5",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "sqlalchemy==2.0.45",
    "uvicorn==0.38.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Скрываем предупреждения об устаревании из starlette и httpx
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]
