<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Card - Финансовый трекер</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-page" class="page active">
        <div class="container">
            <h1>💳 FastAPI Card</h1>
            <p>Персональный финансовый трекер</p>
            
            <div class="auth-form">
                <input type="text" id="login-input" placeholder="Введите логин" maxlength="64">
                <button id="login-btn" class="btn btn-primary">Войти / Зарегистрироваться</button>
            </div>
            
            <div id="auth-error" class="error" style="display: none;"></div>
        </div>
    </div>

    <div id="dashboard-page" class="page">
        <header>
            <div class="header-content">
                <h2>👤 <span id="user-login"></span></h2>
                <div class="header-actions">
                    <span class="total-balance">Общий баланс: <strong id="total-balance">0</strong> <span id="total-currency">RUB</span></span>
                    <button id="logout-btn" class="btn btn-secondary">Выйти</button>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Блок кошельков -->
            <section class="card wallets-section">
                <h3>💼 Мои кошельки</h3>
                <div id="wallets-list" class="wallets-grid"></div>
                
                <div class="form-group">
                    <h4>Создать новый кошелёк</h4>
                    <input type="text" id="wallet-name" placeholder="Название (напр. Карта Сбер)" maxlength="127">
                    <input type="number" id="wallet-balance" placeholder="Начальный баланс" step="0.01" value="0">
                    <select id="wallet-currency">
                        <option value="RUB">RUB</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                    <button id="create-wallet-btn" class="btn btn-primary">Создать</button>
                </div>
            </section>

            <!-- Блок операций -->
            <section class="card operations-section">
                <h3>📊 Операции</h3>
                
                <div class="tabs">
                    <button class="tab active" data-tab="income">💰 Доход</button>
                    <button class="tab" data-tab="expense">💸 Расход</button>
                    <button class="tab" data-tab="transfer">🔄 Перевод</button>
                </div>

                <div id="tab-income" class="tab-content active">
                    <select id="income-wallet" class="wallet-select"></select>
                    <input type="number" id="income-amount" placeholder="Сумма" step="0.01" min="0.01">
                    <input type="text" id="income-description" placeholder="Описание (опционально)" maxlength="255">
                    <button id="add-income-btn" class="btn btn-success">Добавить доход</button>
                </div>

                <div id="tab-expense" class="tab-content">
                    <select id="expense-wallet" class="wallet-select"></select>
                    <input type="number" id="expense-amount" placeholder="Сумма" step="0.01" min="0.01">
                    <input type="text" id="expense-description" placeholder="Описание (опционально)" maxlength="255">
                    <button id="add-expense-btn" class="btn btn-danger">Добавить расход</button>
                </div>

                <div id="tab-transfer" class="tab-content">
                    <label>Из кошелька:</label>
                    <select id="transfer-from" class="wallet-select"></select>
                    <label>В кошелёк:</label>
                    <select id="transfer-to" class="wallet-select"></select>
                    <input type="number" id="transfer-amount" placeholder="Сумма" step="0.01" min="0.01">
                    <button id="make-transfer-btn" class="btn btn-primary">Перевести</button>
                </div>

                <div id="operation-error" class="error" style="display: none;"></div>
                <div id="operation-success" class="success" style="display: none;"></div>
            </section>

            <!-- История операций -->
            <section class="card history-section">
                <h3>📜 История операций</h3>
                <div id="history-list" class="history-list"></div>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
